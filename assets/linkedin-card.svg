<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" />
      <stop offset="100%" stop-color="#0077B5" />
    </linearGradient>
    <linearGradient id="avatar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0A66C2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="198" rx="16" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Subtle glow top left -->
  <circle cx="80" cy="80" r="60" fill="#0A66C2" opacity="0.1" filter="url(#glow)" />
  <!-- Subtle glow bottom right -->
  <circle cx="740" cy="100" r="70" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />

  <!-- Avatar Circle -->
  <g transform="translate(32, 45)">
    <circle cx="42" cy="42" r="42" fill="#1E293B" stroke="url(#avatar-glow)" stroke-width="2.5" />
    <!-- Monogram AL -->
    <text x="42" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#38BDF8" letter-spacing="1px">AL</text>
    
    <!-- LinkedIn Badge on Avatar -->
    <g transform="translate(56, 56)">
      <circle cx="14" cy="14" r="14" fill="#0A66C2" stroke="#0D1117" stroke-width="2.5" />
      <path fill="#FFFFFF" d="M9 7.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-0.4 3.5H6.4v9.6h2.2V11zm7.4 0h-2.1v1.3h-.03c-.3-.6-1.1-1.5-2.6-1.5-2.8 0-3.3 1.8-3.3 4.2v5.6h2.2v-5c0-1.2.02-2.7 1.7-2.7 1.7 0 1.9 1.3 1.9 2.6v5.1h2.2V11z" transform="scale(0.85) translate(0.5, 0.5)" />
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(136, 0)">
    <!-- Top Micro Tag -->
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5px">LINKEDIN VERIFIED PROFILE · EXECUTIVE OVERVIEW</text>

    <!-- Name & Checkmark -->
    <text x="0" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" fill="#F0F6FC">Abraham Lipa Calabilla</text>
    
    <!-- Verified Badge -->
    <g transform="translate(285, 60)">
      <circle cx="9" cy="9" r="9" fill="#0A66C2" />
      <path fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5.5 9.2l2.3 2.3 4.7-4.7" />
    </g>

    <!-- Professional Headline -->
    <text x="0" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Senior Software Analyst · .NET + Azure | CQRS + MediatR | Systems for Top-Tier Mining</text>

    <!-- Pills Row -->
    <g transform="translate(0, 122)">
      <!-- Pill 1: Aegirax -->
      <g>
        <rect x="0" y="0" width="138" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="69" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A5B4FC">⚡ Aegirax (.NET 10)</text>
      </g>
      <!-- Pill 2: IDS Latam -->
      <g transform="translate(144, 0)">
        <rect x="0" y="0" width="148" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="74" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">⛏️ IDS Latam (~40 PRs)</text>
      </g>
      <!-- Pill 3: Tests -->
      <g transform="translate(298, 0)">
        <rect x="0" y="0" width="112" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="56" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F472B6">🧪 1,353+ Tests</text>
      </g>
      <!-- Pill 4: English C2 -->
      <g transform="translate(416, 0)">
        <rect x="0" y="0" width="86" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="43" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4ADE80">🌐 C2 Level</text>
      </g>
    </g>
  </g>

  <!-- Right Side: LinkedIn CTA Button -->
  <g transform="translate(668, 62)">
    <!-- Button Background -->
    <rect x="0" y="0" width="156" height="44" rx="22" fill="url(#btn-bg)" stroke="#38BDF8" stroke-width="1" />
    
    <!-- LinkedIn 'in' Icon inside button -->
    <g transform="translate(16, 12)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#FFFFFF" />
      <path fill="#0A66C2" d="M5.5 4.5a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0zm-.3 3.2H3.3v7.8h1.9V7.7zm6.3 0H9.7v1.1h-.03c-.3-.5-.9-1.2-2.2-1.2-2.3 0-2.7 1.5-2.7 3.5v4.4h1.9V11.5c0-1 .02-2.2 1.4-2.2 1.4 0 1.6 1.1 1.6 2.1v4.1h1.9V7.7z" transform="scale(1.2) translate(-0.5, -0.5)" />
    </g>

    <text x="90" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Conectar ↗</text>
  </g>

  <!-- Subtitle link under button -->
  <text x="746" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">/in/abrlipac</text>

  <!-- Bottom subtle line indicator -->
  <rect x="32" y="174" width="786" height="1" fill="#1E293B" />
  <text x="425" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Arquitectura de Microservicios · Sistemas Críticos de Minería · Plataformas SaaS en Producción</text>
</svg>